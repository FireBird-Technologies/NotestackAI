      var orbit = el("ellipse", { cx: 0, cy: 0, rx: topRadius * 1.25, ry: topRadius, fill: "none", stroke: "#8fbaff", "stroke-width": 1, "stroke-dasharray": "3 7", "vector-effect": "non-scaling-stroke", class: "edge" }, edges);

    function thread(a, b, opacity) { var l = el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "#217cff", "vector-effect": "non-scaling-stroke", class: "edge" }, edges); l.dataset.base = String(opacity); l.style.opacity = String(opacity); }

      el("circle", { r: r * (p.level === 0 ? 4.2 : 3.4), fill: "url(#g" + gi + ")", class: "halo", opacity: p.level < 2 ? 1 : .85 }, g);

  function wrap(s, max, maxLines) {

  /* Camera and labels. Labels live in screen space at a steady size; the greedy pass below keeps the most important ones that

    var cand = [], taken = [];
    function hit(a, b) { return a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1; }

      p.sx = tx + p.x * s; p.sy = ty + p.y * s; p.sr = RAD[p.level] * s;

      var rr = p.sr * 1.15 + 2;
      taken.push({ x1: p.sx - rr, x2: p.sx + rr, y1: p.sy - rr, y2: p.sy + rr, id: p });
      p.t.style.display = "none";
    });
    nodes.forEach(function (p) {
      var fs = LBL[p.level], w = 0; p.lines.forEach(function (l) { w = Math.max(w, l.length); });
      w = w * fs * (p.level === 0 ? 0.76 : 0.57) + 8; var h = p.lines.length * fs * 1.15 + 4, g = p.sr * 1.4 + 3;
      /* the spots to try, in order. A theme's children fan outward, so its label goes on the side facing the centre. */
      var spots = [{ cx: p.sx, top: p.sy + g }, { cx: p.sx, top: p.sy - g - h }];
      if (p.level === 1) {
        var ia = Math.atan2(-p.y, -p.x);
        spots.push({ cx: p.sx + (g + w / 2) * 0.9, top: p.sy - h / 2 }, { cx: p.sx - (g + w / 2) * 0.9, top: p.sy - h / 2 });

    [hint, document.getElementById("bar"), zoomBox].forEach(function (u) {

  /* ---- the card under the sky ---- */

  function select(p, quiet) {

      var c = document.createElement("cite"); c.textContent = s.title; b.appendChild(c); card.appendChild(b);

    shape = next; saveShape(); cancelAnimationFrame(anim); layout(); draw(); fit = frame(nodes); userMoved = false;
    if (selected && selected.level > 0) { apply(); flyTo(frame(subtree(selected), 90, 2.6), 500); }

  function measure() {

  function show(result) {

    var d = result && result.structuredContent;
