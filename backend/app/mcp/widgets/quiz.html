<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  #quiz { padding: 16px; border-radius: 14px; color: #fff; min-height: 300px;
          background-color: #000; background-image: radial-gradient(1.5px 1.5px at 59% 74%,rgba(255,255,255,0.86),transparent),radial-gradient(2px 2px at 26% 26%,rgba(255,255,255,0.72),transparent),radial-gradient(1.5px 1.5px at 25% 15%,rgba(255,255,255,0.4),transparent),radial-gradient(1px 1px at 90% 84%,rgba(255,255,255,0.59),transparent),radial-gradient(2px 2px at 59% 86%,rgba(255,255,255,0.72),transparent),radial-gradient(1px 1px at 69% 11%,rgba(33,124,255,0.98),transparent),radial-gradient(1.5px 1.5px at 78% 6%,rgba(255,255,255,0.7),transparent),radial-gradient(1px 1px at 27% 69%,rgba(255,255,255,0.65),transparent),radial-gradient(1.5px 1.5px at 86% 13%,rgba(255,255,255,0.59),transparent),radial-gradient(1px 1px at 72% 13%,rgba(255,255,255,0.49),transparent),radial-gradient(1px 1px at 38% 6%,rgba(255,255,255,0.41),transparent),radial-gradient(1.5px 1.5px at 15% 40%,rgba(33,124,255,0.45999999999999996),transparent),radial-gradient(1px 1px at 89% 3%,rgba(33,124,255,1),transparent),radial-gradient(1.5px 1.5px at 62% 51%,rgba(255,255,255,0.69),transparent),radial-gradient(1px 1px at 27% 89%,rgba(255,255,255,0.54),transparent),radial-gradient(1px 1px at 3% 55%,rgba(33,124,255,0.87),transparent),radial-gradient(1.5px 1.5px at 3% 10%,rgba(255,255,255,0.46),transparent),radial-gradient(1.5px 1.5px at 73% 27%,rgba(255,255,255,0.94),transparent),radial-gradient(1.5px 1.5px at 18% 56%,rgba(33,124,255,0.7),transparent),radial-gradient(1px 1px at 29% 3%,rgba(255,255,255,0.93),transparent),radial-gradient(1px 1px at 77% 41%,rgba(33,124,255,0.69),transparent),radial-gradient(2px 2px at 79% 85%,rgba(33,124,255,1),transparent),radial-gradient(1px 1px at 29% 59%,rgba(33,124,255,0.82),transparent),radial-gradient(1px 1px at 39% 52%,rgba(33,124,255,0.58),transparent),radial-gradient(1px 1px at 83% 34%,rgba(255,255,255,0.57),transparent),radial-gradient(2px 2px at 60% 19%,rgba(255,255,255,0.69),transparent),radial-gradient(1px 1px at 51% 26%,rgba(255,255,255,0.49),transparent),radial-gradient(1px 1px at 80% 34%,rgba(33,124,255,0.83),transparent),radial-gradient(1.5px 1.5px at 72% 28%,rgba(255,255,255,0.71),transparent),radial-gradient(1px 1px at 55% 9%,rgba(33,124,255,0.76),transparent),radial-gradient(1.5px 1.5px at 34% 33%,rgba(255,255,255,0.84),transparent),radial-gradient(1px 1px at 78% 65%,rgba(255,255,255,0.91),transparent),radial-gradient(1px 1px at 10% 19%,rgba(255,255,255,0.74),transparent),radial-gradient(1px 1px at 80% 81%,rgba(255,255,255,0.9),transparent),radial-gradient(ellipse at 50% 0%,rgba(33,124,255,.07),transparent 55%); border: 1px solid rgba(255,255,255,.1); }
  #top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; font-size: 13px; color: rgba(255,255,255,.72); }
  #title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; font-size: 13px; color: #fff; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.18);
           border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  button:hover:not(:disabled) { background: rgba(33,124,255,.2); }
  button:disabled { opacity: .4; cursor: default; }
  #q { font-size: 17px; line-height: 1.45; margin: 0 0 6px; }
  #kind { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.56); margin-bottom: 10px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; margin: 0 0 8px; padding: 10px 12px; border-radius: 10px;
         background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.18); font-size: 14.5px; line-height: 1.4; }
  .opt.sel { border-color: #217cff; background: rgba(33,124,255,.1); }
  .opt.right { border-color: #5fd39a; background: #0f3a2b; }
  .opt.wrong { border-color: #ff7a8a; background: #4a1822; }
  input[type=text] { width: 100%; padding: 10px 12px; border-radius: 10px; font: inherit; font-size: 14.5px; color: #fff;
                     background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.18); margin-bottom: 8px; }
  #fb { margin: 10px 0; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.18); font-size: 14px; line-height: 1.45; display: none; }
  #fb b.ok { color: #5fd39a; } #fb b.no { color: #ff9aa6; }
  #row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #done { text-align: center; padding: 30px 10px; } #done h2 { margin: 0 0 8px; font-size: 22px; } #done p { color: rgba(255,255,255,.72); margin: 0 0 14px; }
  #msg { padding: 40px 20px; text-align: center; color: rgba(255,255,255,.72); font-size: 15px; }

  /* The app's own look: black, starry, pill buttons, blue only for the main action and for selection. */
  button { border-radius: 999px; background: transparent; border: 1px solid rgba(255,255,255,.18); color: #fff; font-weight: 600; transition: box-shadow .2s, border-color .2s, background .2s; }
  button:hover:not(:disabled) { background: transparent; border-color: rgba(33,124,255,.6); box-shadow: 0 0 12px rgba(33,124,255,.35); }
  button.go { background: #217cff; border: 1px solid #217cff; padding: 10px 22px; box-shadow: 0 0 24px rgba(33,124,255,.35), 0 0 2px rgba(33,124,255,.6); }
  button.go:hover:not(:disabled) { background: rgba(33,124,255,.9); border-color: rgba(33,124,255,.9); box-shadow: 0 0 32px rgba(33,124,255,.6); }
  button:disabled { opacity: .5; }
  .chip, .opt, .pickbtn { border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.18); font-weight: 400; }
  .chip:hover, .opt:hover, .pickbtn:hover { border-color: rgba(33,124,255,.6); box-shadow: 0 0 12px rgba(33,124,255,.2); }
  .chip.sel, .opt.sel { border-color: rgba(33,124,255,.9); background: rgba(33,124,255,.08); box-shadow: 0 0 12px rgba(33,124,255,.2); }
  .row .chip { border-radius: 999px; }
  input[type=text], input[type=search], select { border-radius: 999px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.18); padding-left: 16px; padding-right: 16px; }
  input[type=text]:focus, input[type=search]:focus, select:focus { outline: none; border-color: rgba(33,124,255,.6); box-shadow: 0 0 12px rgba(33,124,255,.2); }
  input[type=checkbox] { accent-color: #217cff; }
</style>
</head>
<body>
<div id="quiz">
  <div id="msg">Loading your quiz...</div>
  <div id="main" hidden>
    <div id="top"><span id="title"></span><span><span id="pos"></span> <button id="open" type="button" hidden>Open in Notestack</button></span></div>
    <div id="body">
      <div id="kind"></div><p id="q"></p><div id="opts"></div>
      <div id="fb"></div>
      <div id="row"><button id="check" type="button">Check</button><button id="next" type="button" hidden>Next</button></div>
    </div>
    <div id="done" hidden><h2 id="score"></h2><p id="note"></p><button id="again" type="button">Try again</button></div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var data = null, qs = [], i = 0, picked = [], checked = false, right = 0;
  var KINDS = { multiple_choice: "Pick one", multiple_select: "Pick all that apply", fill_blank: "Fill in the blank", short_answer: "Short answer" };

  /* ---- talking to the host: JSON-RPC 2.0 over postMessage (MCP Apps) ---- */
  var pending = {}, rid = 1;
  function send(m) { m.jsonrpc = "2.0"; window.parent.postMessage(m, "*"); }
  function request(method, params) {
    return new Promise(function (resolve, reject) { var id = rid++; pending[id] = { resolve: resolve, reject: reject }; send({ id: id, method: method, params: params || {} }); });
  }
  function notify(method, params) { send({ method: method, params: params || {} }); }
  window.addEventListener("message", function (e) {
    if (e.source !== window.parent) return;
    var m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.method) seen.push(m.method);
    if (m.method && m.method.indexOf("tool-result") < 0 && m.params && find(m.params, 0)) { show(unwrap(m.params)); return; }
    if (m.method === undefined && m.id !== undefined) {
      var p = pending[m.id]; if (!p) return; delete pending[m.id];
      if (m.error) p.reject(m.error); else p.resolve(m.result);
    } else if (m.method === "ui/notifications/tool-result") {
      show(unwrap(m.params || {}));
    } else if (m.method === "ui/resource-teardown" && m.id !== undefined) {
      send({ id: m.id, result: {} });
    } else if (m.method === "ping" && m.id !== undefined) {
      send({ id: m.id, result: {} });
    }
  });
  /* Find the payload wherever the host put it (any depth, or as JSON text), and remember what the host sent so a stuck
     view can say what it saw. */
  var seen = [], got = false;
  function find(o, d) {
    if (!o || d > 6) return null;
    if (typeof o === "string") { try { return find(JSON.parse(o), d + 1); } catch (e) { return null; } }
    if (typeof o !== "object") return null;
    if (o.kind === "quiz" && "open_url" in o) return o; /* not the job record, which also has a kind */
    for (var k in o) { var f = find(o[k], d + 1); if (f) return f; }
    return null;
  }
  /* The result as the host hands it over: structuredContent, or the same wrapped in result, or (cards and quizzes) the text. */
  function unwrap(p) {
    var f = find(p, 0); if (f) return { structuredContent: f };
    if (p.structuredContent) return p;
    if (p.result && p.result.structuredContent) return p.result;
    try {
      var t = p.content && p.content[0] && p.content[0].text, v = t ? JSON.parse(t) : null, c = v && v.content;
      if (c && c.questions) return { structuredContent: { kind: "quiz", title: v.title, open_url: v.open_in_notestack, questions: c.questions } };
    } catch (e) { /* not JSON */ }
    return p;
  }
  function reportSize() { notify("ui/notifications/size-changed", { width: Math.ceil(document.documentElement.scrollWidth), height: Math.ceil(document.documentElement.scrollHeight) }); }
  if (window.ResizeObserver) new ResizeObserver(reportSize).observe(document.documentElement);

  /* ---- the quiz ---- */
  function norm(s) { return String(s || "").toLowerCase().replace(/\s+/g, " ").trim(); }
  function render() {
    var q = qs[i]; checked = false; picked = [];
    $("pos").textContent = (i + 1) + " / " + qs.length;
    $("kind").textContent = KINDS[q.type] || "Question";
    $("q").textContent = q.question;
    $("fb").style.display = "none";
    $("next").hidden = true; $("check").hidden = false; $("check").disabled = false;
    var box = $("opts"); box.textContent = "";
    if (q.options) {
      q.options.forEach(function (text, k) {
        var b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.textContent = text;
        b.addEventListener("click", function () {
          if (checked) return;
          if (q.type === "multiple_select") { var at = picked.indexOf(k); if (at < 0) picked.push(k); else picked.splice(at, 1); }
          else picked = [k];
          Array.prototype.forEach.call(box.children, function (c, n) { c.classList.toggle("sel", picked.indexOf(n) >= 0); });
        });
        box.appendChild(b);
      });
    } else {
      var t = document.createElement("input"); t.type = "text"; t.id = "ans"; t.placeholder = "Your answer"; t.autocomplete = "off"; box.appendChild(t);
    }
    reportSize();
  }
  function feedback(ok, text) {
    var fb = $("fb"); fb.textContent = ""; fb.style.display = "block";
    var b = document.createElement("b"); b.className = ok === null ? "" : (ok ? "ok" : "no"); b.textContent = ok === null ? "Compare with the answer: " : (ok ? "Correct. " : "Not quite. ");
    fb.appendChild(b); fb.appendChild(document.createTextNode(text));
  }
  function check() {
    var q = qs[i], ok = null, text = "";
    if (q.options) {
      if (!picked.length) return;
      var want = q.correct || [];
      ok = picked.length === want.length && want.every(function (k) { return picked.indexOf(k) >= 0; });
      Array.prototype.forEach.call($("opts").children, function (c, n) {
        if (want.indexOf(n) >= 0) c.classList.add("right"); else if (picked.indexOf(n) >= 0) c.classList.add("wrong");
      });
      text = ok ? "" : "The answer is " + want.map(function (k) { return q.options[k]; }).join("; ") + ". ";
    } else {
      var given = norm($("ans").value);
      if (!given) return;
      var accepted = [q.answer].concat(q.accepted || []).map(norm);
      if (q.type === "fill_blank") ok = accepted.indexOf(given) >= 0; else ok = null;
      text = (ok ? "" : "The answer is: " + q.answer + ". ");
    }
    if (ok) right++;
    feedback(ok, text + (q.explanation || ""));
    checked = true; $("check").hidden = true; $("next").hidden = false; $("next").textContent = i === qs.length - 1 ? "Finish" : "Next";
    reportSize();
  }
  function finish() {
    $("body").hidden = true; $("done").hidden = false; $("pos").textContent = "";
    $("score").textContent = "You got " + right + " of " + qs.length + " right";
    $("note").textContent = "Short answers are not counted. Open the quiz in Notestack to keep your results.";
    reportSize();
  }
  function start() { i = 0; right = 0; $("body").hidden = false; $("done").hidden = true; render(); }
  function message(text) { $("msg").hidden = false; $("main").hidden = true; $("msg").textContent = text; }
  function show(result) {
    got = true;
    var d = result && result.structuredContent;
    if (!d || d.kind !== "quiz") return message("There is no quiz to show yet.");
    if (!d.questions || !d.questions.length) return message(d.message || "Your quiz is still being made. Ask Claude to show it again in a moment.");
    data = d; qs = d.questions.slice();
    $("msg").hidden = true; $("main").hidden = false;
    $("title").textContent = d.title || "Quiz"; $("open").hidden = !d.open_url;
    start();
  }
  $("check").addEventListener("click", check);
  $("next").addEventListener("click", function () { if (i === qs.length - 1) finish(); else { i++; render(); } });
  $("again").addEventListener("click", start);
  $("open").addEventListener("click", function () { if (data && data.open_url) request("ui/open-link", { url: data.open_url }).catch(function () {}); });

  setTimeout(function () {
    if (got) return;
    var m = document.getElementById("msg"); if (!m || m.hidden) return;
    m.hidden = false; m.textContent = "Still waiting for Notestack's result. The host has sent: " + (seen.length ? seen.join(", ") : "nothing") + ". Ask Claude to show it again, or open it in Notestack.";
  }, 20000);
  setTimeout(function () { notify("ui/notifications/initialized", {}); reportSize(); }, 1500); /* some hosts hold the result until told we are ready */
  request("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "notestack-quiz", version: "1.0.0" }, appCapabilities: {} })
    .then(function () { notify("ui/notifications/initialized", {}); reportSize(); })
    .catch(function () { message("This view needs an app that supports interactive results."); });
})();
</script>
</body>
</html>
