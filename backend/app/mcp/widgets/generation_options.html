<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose settings</title>
<style>
  :root {
    color-scheme: dark;
    --blue: #217cff; --blue-60: rgba(33,124,255,.6); --blue-35: rgba(33,124,255,.35); --blue-20: rgba(33,124,255,.2); --blue-10: rgba(33,124,255,.1);
    --text: #fff; --text-2: rgba(255,255,255,.72); --text-3: rgba(255,255,255,.56);
    --line: rgba(255,255,255,.1); --line-strong: rgba(255,255,255,.18); --surface: rgba(255,255,255,.03); --surface-2: rgba(255,255,255,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  button, input, select { font-family: inherit; }
  #box, #out { padding: 22px; border-radius: 22px; border: 1px solid var(--line); background-color: #000;
    background-image: radial-gradient(1.5px 1.5px at 8% 14%,rgba(255,255,255,.75),transparent),radial-gradient(1px 1px at 19% 72%,rgba(33,124,255,.9),transparent),radial-gradient(1.5px 1.5px at 36% 31%,rgba(255,255,255,.55),transparent),radial-gradient(1px 1px at 54% 83%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 71% 18%,rgba(33,124,255,.7),transparent),radial-gradient(1px 1px at 87% 64%,rgba(255,255,255,.65),transparent),radial-gradient(ellipse at 50% 0%,rgba(33,124,255,.07),transparent 55%); }
  #out { display: none; margin-top: 12px; } #out.on { display: block; } #out > * { margin-top: 0 !important; }
  #box { transition: padding .25s, border-radius .25s; } #box.done { padding: 10px 14px 10px 20px; border-radius: 999px; } #box.done #resbar { margin: 0; } #box.done #resbar b { font-size: .95rem; }
  #reslink { text-decoration: none; color: #7fb2ff; }
  h2 { margin: 0; font: 600 1.25rem "Space Grotesk", Inter, system-ui, sans-serif; letter-spacing: -.01em; }
  .sub { margin: 4px 0 0; font-size: .85rem; color: var(--text-3); }
  .lab { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 8px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .lab:first-of-type { margin-top: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .notebook-grid { max-height: 340px; overflow: auto; padding: 2px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  #nbsearch { margin-bottom: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  /* a card: a notebook, a template, a look */
  .card { position: relative; display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; text-align: left; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; transition: border-color .2s, box-shadow .2s, background .2s, transform .15s; }
  .card:hover { border-color: var(--blue-60); transform: translateY(-1px); }
  .card.on { border-color: var(--blue); background: var(--blue-10); box-shadow: 0 0 18px var(--blue-20); }
  .card.on::after { content: "\2713"; position: absolute; top: 10px; right: 12px; width: 18px; height: 18px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
  .card b { font-weight: 600; font-size: .92rem; padding-right: 22px; line-height: 1.3; } .card small { font-size: .78rem; line-height: 1.4; color: var(--text-3); }
  .card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 9px; margin-bottom: 8px; background: var(--surface-2); }
  .card.add { border-style: dashed; border-color: var(--line-strong); background: transparent; } .card.add.on { border-style: solid; }
  /* a pill: a short choice */
  .vnone { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 500 .95rem var(--font-body); text-align: left; cursor: pointer; margin-bottom: 4px; }
  .vnone .box { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface-2); display: grid; place-items: center; font-size: .8rem; line-height: 1; }
  .vnone.on { border-color: var(--blue-60); } .vnone.on .box { background: var(--blue); border-color: var(--blue); color: #fff; }
  .vlist { display: grid; gap: 8px; margin-top: 8px; } .vlist.off { opacity: .4; pointer-events: none; }
  .voice { display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-align: left; cursor: pointer; font: 600 1rem var(--font-body); }
  .voice:hover { border-color: var(--blue-60); } .voice.on { border-color: var(--blue); background: rgba(33,124,255,.07); box-shadow: 0 0 14px rgba(33,124,255,.2); }
  .voice .play { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: .9rem; color: #fff; }
  .voice .play:hover { background: var(--blue-35); }
  .voice .nm { flex: 1; min-width: 0; } .voice .nm small { display: block; font-weight: 400; font-size: .76rem; color: var(--text-3); text-transform: capitalize; }
  .voice .tick { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: .8rem; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font-size: .88rem; cursor: pointer; transition: border-color .2s, background .2s, color .2s, box-shadow .2s; }
  .pill:hover { border-color: var(--blue-60); color: var(--text); } .pill.on { border-color: var(--blue); background: var(--blue); color: #fff; box-shadow: 0 0 14px var(--blue-35); }
  .pill.on.multi::before { content: "\2713"; font-size: .75rem; }
  .mini { padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--text-2); font-size: .72rem; letter-spacing: 0; text-transform: none; cursor: pointer; transition: border-color .2s, color .2s; } .mini:hover { border-color: var(--blue-60); color: #fff; }
  .minis { display: flex; gap: 6px; }
  input[type=text], select { width: 100%; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: rgba(0,0,0,.6); color: var(--text); font-size: .92rem; transition: border-color .2s, box-shadow .2s; }
  input[type=text]::placeholder { color: var(--text-3); }
  input[type=text]:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 12px var(--blue-35); }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #fff 50%), linear-gradient(135deg, #fff 50%, transparent 50%); background-position: calc(100% - 20px) 19px, calc(100% - 15px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }
  /* the posts */
  .panel { border-radius: 14px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
  .panel input[type=text] { height: 38px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; font-size: .85rem; } .panel input[type=text]:focus { box-shadow: none; }
  .plist { max-height: 232px; overflow: auto; padding: 4px 6px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .plist label { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; font-size: .88rem; color: var(--text-2); cursor: pointer; transition: background .15s, color .15s; } .plist label:hover { background: var(--surface-2); color: #fff; }
  .plist input { appearance: none; flex: none; width: 17px; height: 17px; margin: 0; border-radius: 5px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; display: grid; place-items: center; transition: background .15s, border-color .15s; }
  .plist input:checked { background: var(--blue); border-color: var(--blue); } .plist input:checked::after { content: "\2713"; color: #fff; font-size: 11px; line-height: 1; }
  .plist .none { padding: 14px; font-size: .85rem; color: var(--text-3); }
  /* buttons */
  .foot { display: flex; align-items: center; gap: 10px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: #fff; font-weight: 600; font-size: .92rem; cursor: pointer; transition: box-shadow .2s, border-color .2s, background .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--blue-60); box-shadow: 0 0 12px var(--blue-35); }
  .btn.primary { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 24px var(--blue-35), 0 0 2px var(--blue-60); flex: 1; } .btn.primary:hover { background: rgba(33,124,255,.9); box-shadow: 0 0 32px var(--blue-60); }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  /* progress and result */
  #told { display: none; align-items: center; gap: 10px; margin-top: 14px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: .88rem; color: var(--text-2); }
  #told.err { border-color: rgba(255,120,120,.4); color: #ffb4b4; } #told.ok { border-color: var(--blue-60); color: #fff; }
  #told a { color: #7fb2ff; margin-left: auto; text-decoration: none; font-weight: 600; } #told a:hover { text-decoration: underline; }
  .spin { flex: none; width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--blue); animation: sp .8s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } }
  #msg { padding: 36px 16px; text-align: center; color: var(--text-2); font-size: .95rem; }
  #player { margin-top: 14px; display: none; } #player iframe { display: block; width: 100%; height: 380px; border: 0; border-radius: 14px; background: transparent; }
  #pending, #media { display: none; }
  #pending { min-height: 260px; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: var(--text-2); text-align: center; }
  #pending .spin { width: 24px; height: 24px; }
  #pending.err { color: #ffb4b4; }
  #media { text-align: center; }
  #media img { display: block; max-width: 100%; max-height: 720px; margin: 0 auto; border-radius: 14px; object-fit: contain; }
  #media .audio-card { width: min(720px, 100%); margin: 0 auto; padding: 18px; border: 1px solid var(--line-strong); border-radius: 18px; background: linear-gradient(145deg, rgba(33,124,255,.14), rgba(255,255,255,.035)); text-align: left; }
  #media .audio-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  #media .audio-mark { flex: none; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--blue); box-shadow: 0 0 20px var(--blue-35); font-size: 1.05rem; }
  #media .audio-copy { min-width: 0; } #media .audio-copy b { display: block; font-size: .95rem; } #media .audio-copy span { display: block; margin-top: 2px; color: var(--text-3); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #media .audio-controls { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 12px; }
  #media .audio-toggle { width: 42px; height: 42px; padding: 0; border: 0; border-radius: 50%; background: #fff; color: #050505; font-size: 1rem; cursor: pointer; }
  #media .audio-range { width: 100%; accent-color: var(--blue); cursor: pointer; }
  #media .audio-time { min-width: 82px; color: var(--text-2); font-variant-numeric: tabular-nums; font-size: .78rem; text-align: right; }
  .result-link { display: grid; gap: 5px; width: min(720px, 100%); margin: 14px auto 0; padding: 11px 14px; border: 1px solid var(--blue-35); border-radius: 12px; background: rgba(33,124,255,.08); text-align: left; }
  .result-link span { color: var(--text-3); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; }
  .result-link a { color: #8fbbff; font-size: .84rem; line-height: 1.4; overflow-wrap: anywhere; text-decoration: none; }
  .result-link a:hover { text-decoration: underline; }
  #feedback { display: none; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 14px; color: var(--text-3); font-size: .8rem; }
  #feedback.on { display: flex; }
  #feedback button { width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text-2); cursor: pointer; font-size: 1rem; }
  #feedback button:hover { border-color: var(--blue-60); color: #fff; } #feedback button.on { border-color: var(--blue); background: var(--blue-20); color: #fff; box-shadow: var(--glow-sm); }
  #feedback button:disabled { cursor: wait; opacity: .6; }
  #feedback-status { min-width: 48px; }
  #media .preview-card { padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-align: left; }
  #media .preview-card b { display: block; margin-bottom: 7px; }
  #media .preview-url { display: block; width: 100%; padding: 11px 14px; border: 1px solid var(--blue-35); border-radius: 10px; background: rgba(33,124,255,.08); color: #8fbbff; text-align: left; overflow-wrap: anywhere; cursor: pointer; }
  #media .render-note { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; color: var(--text-2); font-size: .85rem; }
  #media .nav { justify-content: center; }
  body.output-only #where, body.output-only #setup, body.output-only #msg { display: none !important; }
  body.output-only #out { display: block; }
  body.output-only.single-result #box { display: none; }
  body.output-only.single-result #out { margin-top: 0; padding: 0; border: 0; border-radius: 0; background: transparent; }
  body.output-only.single-result #player, body.output-only.single-result #cards, body.output-only.single-result #quizv,
  body.output-only.single-result #doc { margin-top: 0; }
  /* the result screen, flashcards and the quiz */
  #resbar { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; } #resbar b { flex: 1; font: 600 1.15rem "Space Grotesk", Inter, system-ui, sans-serif; }
  #cards, #quizv { display: none; margin-top: 14px; }
  .fc { display: block; width: 100%; min-height: 230px; padding: 28px 26px; text-align: center; border-radius: 18px; border: 1px solid var(--line-strong); background: linear-gradient(160deg, rgba(33,124,255,.12), rgba(255,255,255,.02)); color: #fff; cursor: pointer; transition: border-color .2s, box-shadow .2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .fc:hover { border-color: var(--blue-60); box-shadow: 0 0 20px var(--blue-20); } .fc.back { border-color: var(--blue); background: linear-gradient(160deg, rgba(33,124,255,.24), rgba(33,124,255,.06)); }
  .fc .cap { margin: 0; } .fc .t { font-size: 1.15rem; line-height: 1.5; font-weight: 600; } .fc.back .t { font-weight: 400; font-size: 1.02rem; }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; } .nav .pos { color: var(--text-3); font-size: .85rem; } .nav .btn { height: 38px; padding: 0 18px; }
  .qq { font-size: 1.1rem; line-height: 1.5; font-weight: 600; margin: 4px 0 14px; }
  .opt { display: block; width: 100%; text-align: left; margin: 0 0 8px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font-size: .92rem; line-height: 1.45; cursor: pointer; transition: border-color .2s, background .2s; }
  .opt:hover { border-color: var(--blue-60); color: #fff; } .opt.on { border-color: var(--blue); background: var(--blue-10); color: #fff; }
  .opt.good { border-color: #3ecf8e; background: rgba(62,207,142,.12); color: #fff; } .opt.bad { border-color: #ff7a8a; background: rgba(255,122,138,.12); color: #fff; }
  .fb { margin: 12px 0; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: .9rem; line-height: 1.55; color: var(--text-2); } .fb b.ok { color: #3ecf8e; } .fb b.no { color: #ff9aa6; }
  .score { text-align: center; padding: 26px 10px; } .score h2 { font-size: 1.6rem; margin-bottom: 6px; } .score p { color: var(--text-2); margin: 0 0 16px; }
  /* a finished report, read in place */
  #doc { display: none; margin-top: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
  #dochead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #dochead b { font: 600 .95rem "Space Grotesk", Inter, system-ui, sans-serif; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #docbody { max-height: 520px; overflow: auto; padding: 8px 22px 14px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .doc > :last-child { margin-bottom: 0; }
  .doc h1, .doc h2, .doc h3 { font-family: "Space Grotesk", Inter, system-ui, sans-serif; letter-spacing: -.01em; line-height: 1.25; margin: 1.5em 0 .5em; }
  .doc h1 { font-size: 1.5rem; } .doc h2 { font-size: 1.2rem; } .doc h3 { font-size: 1.02rem; color: var(--text-2); }
  .doc p { margin: .7em 0; line-height: 1.7; font-size: .95rem; color: var(--text-2); } .doc li { line-height: 1.65; font-size: .95rem; color: var(--text-2); margin: .25em 0; }
  .doc ul, .doc ol { padding-left: 1.3em; } .doc strong { color: #fff; } .doc a { color: #7fb2ff; } .doc code { padding: 1px 6px; border-radius: 6px; background: var(--surface-2); font-size: .85em; }
  .doc .blk { margin: 1.1em 0; } .doc .cap { margin: 0 0 8px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .doc .callout { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--blue-35); background: var(--blue-10); } .doc .callout p { margin: .3em 0; color: #fff; }
  .doc table { width: 100%; border-collapse: collapse; font-size: .88rem; } .doc th, .doc td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--text-2); } .doc th { color: #fff; font-weight: 600; }
  .doc dl { margin: 0; } .doc dt { font-weight: 600; margin-top: .7em; } .doc dd { margin: .15em 0 0; color: var(--text-2); font-size: .92rem; line-height: 1.6; }
  .doc .ev { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); } .doc .ev i { font-style: normal; color: #7fb2ff; font-size: .85rem; }
  .doc .note { padding: 12px 16px; border-radius: 12px; border: 1px dashed var(--line-strong); color: var(--text-3); font-size: .88rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="box">
  <div id="msg">Loading...</div>
  <div id="main" hidden>
    <div id="where" hidden>
      <h2>What should it use?</h2><p class="sub">Pick a notebook, then choose which of its posts to include.</p>
      <div class="lab"><span>Notebook</span><span id="nbcount"></span></div>
      <input type="text" id="nbsearch" placeholder="Search all notebooks" maxlength="100">
      <div class="grid notebook-grid" id="notebooks"></div>
      <div id="pbox" hidden>
        <div class="lab"><span id="plabel">Posts to use</span><span class="minis"><button type="button" class="mini" id="pall">All</button><button type="button" class="mini" id="pnone">None</button></span></div>
        <div class="panel"><input type="text" id="psearch" placeholder="Search posts" maxlength="80"><div class="plist" id="plist"></div></div>
      </div>
      <div class="foot"><button class="btn primary" id="next" type="button" disabled>Next</button></div>
    </div>
    <div id="setup" hidden>
      <h2 id="title"></h2><p class="sub" id="from"></p>
      <div id="fields"></div>
      <div class="foot"><button class="btn" id="back" type="button" hidden>Back</button><button class="btn primary" id="go" type="button">Make it</button></div>
    </div>
    <div id="resbar" hidden><b id="restitle"></b><a href="#" class="mini" id="reslink" hidden>Open in Notestack</a></div>
    <div id="told"></div>
  </div>
</div>
<div id="out">
  <div id="pending"></div><div id="cards"></div><div id="quizv"></div><div id="player"></div><div id="media"></div>
  <div id="artifact-link"></div>
  <div id="feedback"><span>Was this useful?</span><button id="thumb-up" type="button" aria-label="Thumbs up" title="Thumbs up">&#128077;</button><button id="thumb-down" type="button" aria-label="Thumbs down" title="Thumbs down">&#128078;</button><span id="feedback-status" aria-live="polite"></span></div>
  <div id="doc"><div id="dochead"><b id="doctitle"></b></div><div id="docbody" class="doc"></div></div>
</div>
<script>
(function () {
  "use strict";
  var PLAYERS = /*__PLAYERS__*/{};
  var $ = function (id) { return document.getElementById(id); };
  var data = null, sel = {}, seen = [], got = false, nb = null, nbTitle = "", frame = null, shown = null;
  var pickNb = null, newMode = false, archiveMode = false, list = null, tick = {}, query = "", nbQuery = "", docs = null;

  /* ---- talking to the host: JSON-RPC 2.0 over postMessage (MCP Apps) ---- */
  var pending = {}, rid = 1;
  function send(m) { m.jsonrpc = "2.0"; window.parent.postMessage(m, "*"); }
  function request(method, params) {
    return new Promise(function (resolve, reject) { var id = rid++; pending[id] = { resolve: resolve, reject: reject }; send({ id: id, method: method, params: params || {} }); });
  }
  function notify(method, params) { send({ method: method, params: params || {} }); }
  function find(o, d) {
    if (!o || d > 6) return null;
    if (typeof o === "string") { try { return find(JSON.parse(o), d + 1); } catch (e) { return null; } }
    if (typeof o !== "object") return null;
    if (o.kind === "generation_options") return o;
    for (var k in o) { var f = find(o[k], d + 1); if (f) return f; }
    return null;
  }
  window.addEventListener("message", function (e) {
    var m = e.data;

    row.appendChild(label); row.appendChild(link); box.appendChild(row); return true;
  }
  function showArtifactLink(v) { var box = $("artifact-link"); box.textContent = ""; return appendNotestackLink(box, v); }
  function showFeedback(v) {
    var id = v && (v.id || v.artifact_id); if (!id) return;
    var picked = v.feedback && v.feedback.rating;
    var up = $("thumb-up"), down = $("thumb-down"), status = $("feedback-status");
    $("feedback").classList.add("on"); up.classList.toggle("on", picked === "up"); down.classList.toggle("on", picked === "down");
    function rate(value) {
      up.disabled = down.disabled = true; status.textContent = "Saving...";
      call("rate_artifact", { artifact_id: id, rating: value }).then(function () {
        picked = value; up.classList.toggle("on", value === "up"); down.classList.toggle("on", value === "down"); status.textContent = "Saved";
      }, function () { status.textContent = "Could not save"; }).then(function () { up.disabled = down.disabled = false; reportSize(); });
    }
    up.onclick = function () { rate("up"); }; down.onclick = function () { rate("down"); };
  }
  function clock(seconds) {
    if (!isFinite(seconds) || seconds < 0) return "0:00";
    var whole = Math.floor(seconds), minutes = Math.floor(whole / 60), rest = String(whole % 60);
    return minutes + ":" + (rest.length < 2 ? "0" : "") + rest;
  }
  function showAudio(box, v) {
    var src = v.url || v.download_url, card = el("div", "audio-card"), head = el("div", "audio-head");
    head.appendChild(el("div", "audio-mark", "\u266b"));
    var copy = el("div", "audio-copy"); copy.appendChild(el("b", "", v.title || "Audio overview")); copy.appendChild(el("span", "", "Made from your Notestack sources"));
    head.appendChild(copy); card.appendChild(head);
    var audio = document.createElement("audio"); audio.preload = "metadata"; audio.src = src; audio.hidden = true; card.appendChild(audio);
    var controls = el("div", "audio-controls"), toggle = el("button", "audio-toggle", "\u25b6"), range = document.createElement("input"), time = el("span", "audio-time", "0:00 / 0:00");
    toggle.type = "button"; toggle.setAttribute("aria-label", "Play audio"); range.type = "range"; range.className = "audio-range"; range.min = "0"; range.max = "1000"; range.value = "0"; range.setAttribute("aria-label", "Audio position");
    toggle.addEventListener("click", function () { if (audio.paused) audio.play().catch(function () {}); else audio.pause(); });
    audio.addEventListener("play", function () { toggle.textContent = "\u275a\u275a"; toggle.setAttribute("aria-label", "Pause audio"); });
    audio.addEventListener("pause", function () { toggle.textContent = "\u25b6"; toggle.setAttribute("aria-label", "Play audio"); });
    audio.addEventListener("ended", function () { toggle.textContent = "\u25b6"; range.value = "0"; });
    function updateAudio() { range.value = audio.duration ? String(Math.round(audio.currentTime / audio.duration * 1000)) : "0"; time.textContent = clock(audio.currentTime) + " / " + clock(audio.duration); }
    audio.addEventListener("loadedmetadata", updateAudio); audio.addEventListener("durationchange", updateAudio); audio.addEventListener("timeupdate", updateAudio);
    range.addEventListener("input", function () { if (audio.duration) audio.currentTime = Number(range.value) / 1000 * audio.duration; });
    controls.appendChild(toggle); controls.appendChild(range); controls.appendChild(time); card.appendChild(controls); box.appendChild(card);
  }
  function showMedia(v) {
    var box = $("media"); box.textContent = ""; finishSurface(); showOut("media");
    if (data.make === "infographic" && v.url) {
      var image = document.createElement("img"); image.src = v.url; image.alt = v.title || "Notestack infographic"; box.appendChild(image); reportSize(); return;
    }
    if (data.make === "audio_overview" && (v.url || v.download_url)) {
      showAudio(box, v); reportSize(); return;
    }
    if (data.make === "slide_deck" && v.slide_urls && v.slide_urls.length) {
      var slides = v.slide_urls.slice(), i = 0;
      function drawSlide() {
        box.textContent = ""; var image = document.createElement("img"); image.src = slides[i]; image.alt = "Slide " + (i + 1); box.appendChild(image);
        var nav = el("div", "nav"), prev = el("button", "btn", "Previous"), pos = el("span", "pos", (i + 1) + " / " + slides.length), next = el("button", "btn primary", "Next");
        prev.type = next.type = "button"; prev.disabled = i === 0; next.disabled = i === slides.length - 1;
        prev.addEventListener("click", function () { i--; drawSlide(); }); next.addEventListener("click", function () { i++; drawSlide(); });
        nav.appendChild(prev); nav.appendChild(pos); nav.appendChild(next); box.appendChild(nav); reportSize();
      }
      drawSlide(); return;
    }
    var linked = !!((v && (v.artifact_preview_url || v.open_in_notestack || v.open_url)) || resUrl);
    box.insertBefore(el("p", "sub", linked ? "The finished output is available in Notestack." : "The finished output is saved in Notestack, but no open link was returned."), box.firstChild);
    reportSize();
  }
  function showVideoPreview(v) {
    if (!v.preview_url) return;
    var box = $("media"), current = box.getAttribute("data-preview");
    if (current === v.preview_url) return;
    box.textContent = ""; box.setAttribute("data-preview", v.preview_url); finishSurface(); showOut("media");
    var card = el("div", "preview-card"); card.appendChild(el("b", "", "Video preview"));
    var preview = el("button", "preview-url", v.preview_url); preview.type = "button";
    preview.addEventListener("click", function () { request("ui/open-link", { url: v.preview_url }).catch(function () { window.open(v.preview_url, "_blank"); }); });
    card.appendChild(preview); box.appendChild(card);
    var note = el("div", "render-note"); note.appendChild(el("span", "spin")); note.appendChild(el("span", "", "Live preview is ready. The final video is still rendering and will replace it here."));
    var open = el("button", "mini", "Open live preview"); open.type = "button";
    open.addEventListener("click", function () { request("ui/open-link", { url: v.preview_url }).catch(function () { window.open(v.preview_url, "_blank"); }); });
    note.appendChild(open); box.appendChild(note); $("pending").style.display = "none"; reportSize();
  }

  /* ---- a finished report, drawn here ---- */
  function inl(parent, text) {
    var re = /(\*\*[^*]+\*\*|\*[^*\s][^*]*\*|`[^`]+`|\[[^\]]+\]\(https?:[^)\s]+\))/g, last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      var t = m[0], n;
      if (t.indexOf("**") === 0) { n = el("strong", "", t.slice(2, -2)); }
      else if (t.charAt(0) === "`") { n = el("code", "", t.slice(1, -1)); }
      else if (t.charAt(0) === "[") {
        var mm = /^\[([^\]]+)\]\((.+)\)$/.exec(t); n = el("a", "", mm[1]); n.href = mm[2];
        n.addEventListener("click", (function (u) { return function (e) { e.preventDefault(); request("ui/open-link", { url: u }).catch(function () {}); }; })(mm[2]));
      } else { n = el("em", "", t.slice(1, -1)); }
      parent.appendChild(n); last = m.index + t.length;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }
  function markdown(host, text) {
    var lines = String(text).split("\n"), list = null, para = null;
    function close() { list = null; para = null; }
    lines.forEach(function (ln) {
      var h = /^(#{1,3})\s+(.*)$/.exec(ln), b = /^\s*[-*]\s+(.*)$/.exec(ln), o = /^\s*\d+[.)]\s+(.*)$/.exec(ln);
      if (h) { close(); var hh = el("h" + h[1].length); inl(hh, h[2]); host.appendChild(hh); }
      else if (b || o) {
        var kind = b ? "ul" : "ol";
        if (!list || list.tagName.toLowerCase() !== kind) { list = el(kind); host.appendChild(list); para = null; }
        var li = el("li"); inl(li, (b || o)[1]); list.appendChild(li);
      } else if (!ln.trim()) { close(); }
      else { list = null; if (!para) { para = el("p"); host.appendChild(para); } else para.appendChild(document.createTextNode(" ")); inl(para, ln.trim()); }
    });
  }
  function block(host, b) {
    var d = el("div", "blk"); if (b.title && b.type !== "prose" && b.type !== "callout") d.appendChild(el("div", "cap", b.title));
    if (b.type === "prose") { d.className = ""; markdown(d, b.text); }
    else if (b.type === "callout") { d.className = "blk callout"; if (b.title) d.insertBefore(el("p", "", b.title), null).style.fontWeight = "600"; var p = el("p"); inl(p, b.text); d.appendChild(p); }
    else if (b.type === "key_terms") { var dl = el("dl"); b.terms.forEach(function (t) { dl.appendChild(el("dt", "", t.term)); dl.appendChild(el("dd", "", t.definition)); }); d.appendChild(dl); }
    else if (b.type === "table") {
      var tb = el("table"), tr = el("tr"); b.headers.forEach(function (x) { tr.appendChild(el("th", "", x)); }); var th = el("thead"); th.appendChild(tr); tb.appendChild(th);
      var tbd = el("tbody"); b.rows.forEach(function (r) { var row = el("tr"); r.forEach(function (c) { row.appendChild(el("td", "", c)); }); tbd.appendChild(row); }); tb.appendChild(tbd); d.appendChild(tb);
    } else if (b.type === "timeline") {
      b.events.forEach(function (e) { var r = el("div", "ev"); r.appendChild(el("i", "", e.when)); var c = el("div"); c.appendChild(el("b", "", e.title)); if (e.detail) c.appendChild(el("div", "", e.detail)); r.appendChild(c); d.appendChild(r); });
    } else if (b.type === "flashcards") {
      var f = el("dl"); b.cards.forEach(function (c) { f.appendChild(el("dt", "", c.front)); f.appendChild(el("dd", "", c.back)); }); d.appendChild(f);
      if (b.count > b.cards.length) d.appendChild(el("p", "", "+ " + (b.count - b.cards.length) + " more cards in Notestack"));
    } else if (b.type === "quiz") {
      var ol = el("ol"); b.questions.forEach(function (q) { ol.appendChild(el("li", "", q)); }); d.appendChild(ol);
      if (b.count > b.questions.length) d.appendChild(el("p", "", "+ " + (b.count - b.questions.length) + " more questions in Notestack"));
    } else { d.appendChild(el("div", "note", "This " + b.type.replace("_", " ") + " is best viewed in Notestack.")); }
    host.appendChild(d);
  }
  function showReport(id) {
    call("view_report", { artifact_id: id }).then(function (res) {
      var r = res.structuredContent;
      if (!r || !r.blocks || !r.blocks.length) return;
      finishSurface(); showOut("doc"); $("doctitle").textContent = r.title;
      var body = $("docbody"); body.textContent = "";
      r.blocks.forEach(function (b) { block(body, b); });
      reportSize();
    }, function () { /* the link still works */ });
  }
  /* any failure: a plan limit gets the upgrade message and button, wherever it happens */
  function fail(v, fallback) {
    if (v && v.error === "plan_limit") {
      var up = v.upgrade_to ? String(v.upgrade_to).charAt(0).toUpperCase() + String(v.upgrade_to).slice(1) : "";
      return status((v.message || "You have used everything your plan includes.") + (up ? " Upgrade to " + up + " to continue." : " Upgrade your plan to continue."), v.upgrade_url, "err", "Upgrade plan");
    }
    status((v && v.message) || fallback, null, "err");
  }
  function check(id, pollUrl, pollToken) {
    if (data.make !== "video" || !pollUrl) return call(data.make === "video" ? "get_video" : "get_artifact", { artifact_id: id });
    return fetch(pollUrl, { method: "POST", headers: { "Content-Type": "text/plain" }, body: pollToken, cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("status " + r.status);
      return r.json().then(function (v) { return { direct: v }; });
    }).catch(function () { return call("get_video", { artifact_id: id }); });
  }
  function watch(id, tries, pollUrl, pollToken) {
    check(id, pollUrl, pollToken).then(function (res) {
      var v = res.direct || res.structuredContent || parse(res) || {};
      if (data.make === "video" && v.ready) v.status = "ready";
      if (data.make === "video" && v.preview_url && !v.video_url) {
        result("Video preview ready", v.open_in_notestack || v.open_url);
        showVideoPreview(v);
      }
      if (v.status === "ready") {
        remember(id, "ready", v);
        clearResult(); result(nice().charAt(0).toUpperCase() + nice().slice(1) + " made", v.open_in_notestack || v.open_url);
        showArtifactLink(v);
        showFeedback(v);
        var context = "The writer's " + data.make + " was made in Notestack and is ready.";
        if (v.artifact_preview_url || v.open_in_notestack || v.open_url) context += " Artifact preview URL: " + (v.artifact_preview_url || v.open_in_notestack || v.open_url);
        if (v.preview_url) context += " Preview: " + v.preview_url;
        request("ui/update-model-context", { content: [{ type: "text", text: context }] }).catch(function () {});
        if (data.make === "report") play(id);
        else if (data.make === "flashcards") view("show_flashcards", id, showCards);
        else if (data.make === "quiz") view("show_quiz", id, showQuiz);
        else if (!play(id, data.make === "video" ? v : null)) {
          showMedia(v);
        }
      } else if (v.error) {
        remember(id, "failed", v);
        $("go").disabled = false; fail(v, "Could not check progress.");
      } else if (v.status === "failed") {
        remember(id, "failed", v);
        status("Notestack could not make it. Try again.", v.open_in_notestack, "err"); $("go").disabled = false;
      } else if (tries > 0) {
        setTimeout(function () { watch(id, tries - 1, pollUrl, pollToken); }, 3000);
      } else { status("Still being made. It will be in your Notestack.", v.open_in_notestack, "busy"); }
    }, function () { status("Started. It will be in your Notestack.", null, "ok"); });
  }
  $("go").addEventListener("click", function () {
    var args = {};
    (data.fields || []).forEach(function (f) {
      var v = sel[f.key];
      if (v === "" || v === null || v === undefined) return;
      if (f.type === "multi" && v.length === (f.options || []).length) return; /* all of them is the default */
      if (f.type === "voices") { /* a chosen voice is sent as generate_video's own voice arguments */
        if (v === "none") { args.voice_gender = "none"; return; }
        var vo = (f.options || []).filter(function (o) { return o.value === v; })[0];
        args.custom_voice_id = v; if (vo && vo.gender) args.voice_gender = vo.gender; if (vo && vo.accent) args.voice_accent = vo.accent;
        return;
      }
      args[f.key] = v;
    });
    if (newMode) {
      /* The notebook is made only when the writer commits to generation, not while browsing the form. */
    } else if (archiveMode) {
      args.archive = true; if (docs) args.document_ids = docs;
    } else {
      args.notebook_id = nb; if (docs) args.document_ids = docs;
    }
    if (data.make !== "video") args.wait_seconds = 0;
    $("go").disabled = true; clearResult(); enterOutput("Making " + nice()); status("Starting your " + nice(), null, "busy");
    function start() { call(data.tool, args).then(function (res) {
      var v = parse(res) || {};
      if (res.isError || v.error) {
        $("go").disabled = false;         return fail(v, "Notestack could not start it.");
      }
      status("Making your " + nice() + (data.make === "video" ? ". Videos take a few minutes" : ""), v.open_in_notestack, "busy");
      if (v.id) { remember(v.id, "generating", v); watch(v.id, data.make === "video" ? 240 : 80, v.poll_url, v.poll_token); }
    }, function () {
      $("go").disabled = false;       status("This chat app would not let the form start it. Ask " + (data.assistant_name || "the assistant") + " to make it with " + (docs ? docs.length + " chosen posts" : "my notebook") + " with the settings I picked", null, "err");
    }); }
    if (!newMode) return start();
    call("create_notebook", { title: "Selected posts", document_ids: docs }).then(function (res) {
      var v = parse(res) || {};
      if (res.isError || v.error || !v.id) { $("go").disabled = false; return fail(v, "Could not make the notebook."); }
      nb = v.id; nbTitle = v.title || "your new notebook"; args.notebook_id = nb; start();
    }, function () { $("go").disabled = false; status("Could not make the notebook.", null, "err"); });
  });
  setTimeout(function () {
    if (got) return;
    $("msg").textContent = "Still waiting for the options. The host has sent: " + (seen.length ? seen.join(", ") : "nothing") + ". Ask the assistant to list them in words.";
  }, 20000);
  setTimeout(function () { notify("ui/notifications/initialized", {}); reportSize(); }, 1500);
  request("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "notestack-generation-options", version: "3.2.0" }, appCapabilities: {} })
    .then(function () { notify("ui/notifications/initialized", {}); reportSize(); })
    .catch(function () { $("msg").textContent = "This view needs an app that supports interactive results."; });
})();
</script>
